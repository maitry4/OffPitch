name: Deploy Frontend to Cloudflare
on:
  push:
    branches: [main]
    paths:
      - 'frontend/offpitch/**'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/offpitch/package-lock.json
      - name: Install dependencies
        working-directory: frontend/offpitch
        run: npm ci
      - name: Build with OpenNext
        working-directory: frontend/offpitch
        run: npx opennextjs-cloudflare build
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: frontend/offpitch
          secrets: |
            AUTH_SECRET
            CLIENT_ID
            CLIENT_SECRET
            NEXT_PUBLIC_API_URL
            AUTH_URL
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          AUTH_URL: "https://offpitch.probmaitry.workers.dev"
